name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "platform-tools"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Unit tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hotwinter-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
